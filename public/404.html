<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Sayfa bulunamadı — Eray Ömeroğlu</title>
  <style>
    html, body { margin: 0; height: 100%; background: #080b11; color: #eae5ec; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    main { min-height: 100%; display: grid; place-content: center; gap: 14px; padding: 24px; text-align: center; }
    h1 { margin: 0; font-size: clamp(40px, 9vw, 80px); letter-spacing: -0.03em; }
    p { margin: 0; color: rgba(234, 229, 236, 0.75); }
    a { display: inline-block; margin-top: 10px; padding: 12px 22px; color: #5eead4; border: 1px solid #5eead4; border-radius: 30px; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>Aradığın sayfa bulunamadı.</p>
    <p><a href="/">Ana sayfaya dön</a></p>
  </main>
</body>
</html>
